[package]
name = "wb-proc"
description = "CLI resolution and launch, bounded output, process tree termination, Windows Job Object."
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
serde_json = "1"
