name: Windows App

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'apps/linux/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'apps/linux/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Rust tests and bridge
        working-directory: core
        run: |
          cargo test -p wb-proc -p wb-git -p wb-secrets -p wb-pty
          cargo build -p wb-bridge --release
      - name: Check scripts
        shell: bash
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          status=0
          for f in scripts/check-*.mts; do
            echo "::group::$f"
            node --experimental-strip-types --no-warnings "$f" || status=1
            echo "::endgroup::"
          done
          # 同一套測試跑 Rust 後端：兩邊行為要一樣
          for f in scripts/check-cowork.mts scripts/check-cowork-gates.mts; do
            echo "::group::$f (rust)"
            WB_CORE_GIT=rust WB_CORE_PROC=rust node --experimental-strip-types --no-warnings "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
